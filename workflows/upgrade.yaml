workflow:
  name: upgrade
  input:
    - target system revision
  preconditions:
    - existing .engsys/project.yaml
    - existing .engsys/lock.yaml
  output:
    - upgrade plan before any write
  writes-after-approval:
    - .engsys/lock.yaml
    - generated project adapter files only
  must-not:
    - modify project source code
    - modify project-owned documentation
    - silently change a locked package revision
  verify:
    - project contract validates against schema
    - project native verify command succeeds
