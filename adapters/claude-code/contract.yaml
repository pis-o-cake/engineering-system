adapter:
  name: claude-code
  plugin: engsys
  status: draft

launcher:
  command: engsys claude
  plugin-root: project lock system.revision and package set
  cache: developer-local Git worktree plus materialized plugin view

assembly:
  source: package-owned claude-code declarations
  runtime: selected lock packages only

context-budget:
  project-route-max-lines: 12
  skill-description-max-characters: 240
  skill-instructions-max-lines: 150
  default-loaded-policy: none

package-contributions:
  source: packages/*/package.yaml package.claude-code
  selection: project lock packages
  materialization: developer-local plugin view

non-goals:
  - no UserPromptSubmit classifier in v0.1
  - no Stop hook that runs verification automatically
  - no hook as the only enforcement path
