system:
  profile: baseline

project:
  name: example-service
  source-of-truth:
    runtime: src/
    schema: migrations/

commands:
  verify: make check
  environment-check: make env-check
  environment-setup: make env-setup

vcs:
  commit:
    subject-language: en
    subject-ending: imperative
  branch:
    model: env-branch
    roles:
      - role: development
        branch: develop
      - role: staging
        branch: staging
      - role: production
        branch: main
    prefixes:
      feature: feature/
      fix: fix/
      hotfix: hotfix/
    protected:
      - develop
      - staging
      - main
  merge-request:
    target: develop

documentation:
  policy: docs/documentation-policy.md
  architecture: docs/architecture/README.md
  generated:
    - output: docs/architecture/data-model.md
      command: make docs-schema
  lifecycle:
    design:
      path: docs/design
      frozen-status: [implemented]
    adr:
      path: docs/adr
      frozen-status: [accepted]
