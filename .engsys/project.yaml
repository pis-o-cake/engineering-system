system:
  profile: 'baseline'

project:
  name: 'engineering-system'
  source-of-truth:
    system: 'system.yaml'
    packages: 'packages/'
    schemas: 'schemas/'

commands:
  verify: 'sh tests/test-all.sh'

vcs:
  commit:
    subject-language: 'ko'
    subject-ending: 'noun'
    scopes:
      - 'adapter'
      - 'design'
      - 'docs-gov'
      - 'foundation'
      - 'pipeline'
      - 'system'
      - 'vcs-gov'
  branch:
    model: 'single-main'
    protected:
      - 'main'
  merge-request:
    target: 'main'

documentation:
  policy: 'packages/docs-gov/policy.yaml'
  architecture: 'docs/architecture/README.md'
  generated:
    - output: 'docs/generated/system-catalog.md'
      command: 'python3 tools/generate-catalog.py --check'
  authoring:
    assign:
      - path: 'README.md'
        type: 'guide'
      - path: 'docs/adr'
        type: 'decision-record'
      - path: 'docs/architecture'
        type: 'architecture'
      - path: 'docs/design'
        type: 'design-proposal'
    deferred:
      - 'docs/design/0001-foundation.md'
      - 'docs/design/0002-document-authoring-contracts.md'
  review:
    scopes:
      - 'docs'
      - 'README.md'
  lifecycle:
    design:
      path: 'docs/design'
      frozen-status: ['implemented']
    adr:
      path: 'docs/adr'
      frozen-status: ['accepted']
