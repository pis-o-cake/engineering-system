system:
  profile: 'baseline'

project:
  name: 'engineering-system'
  source-of-truth:
    system: 'system.yaml'
    packages: 'packages/'
    schemas: 'schemas/'

commands:
  verify: 'sh tests/test-all.sh'

documentation:
  policy: 'packages/docs-gov/policy.yaml'
  architecture: 'docs/architecture/README.md'
  generated:
    - output: 'docs/generated/system-catalog.md'
      command: 'python3 tools/generate-catalog.py --check'
  lifecycle:
    design:
      path: 'docs/design'
      frozen-status: ['implemented']
    adr:
      path: 'docs/adr'
      frozen-status: ['accepted']
