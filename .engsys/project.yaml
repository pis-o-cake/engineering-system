system:
  profile: 'baseline'

project:
  name: 'engineering-system'
  source-of-truth:
    system: 'system.yaml'
    packages: 'packages/'
    schemas: 'schemas/'

commands:
  verify: 'sh tests/test-all.sh'
  environment-check: 'command -v python3 >/dev/null 2>&1'

vcs:
  commit:
    subject-language: 'ko'
    subject-ending: 'noun'
    scopes:
      - 'adapter'
      - 'design'
      - 'docs-gov'
      - 'foundation'
      - 'pipeline'
      - 'system'
      - 'vcs-gov'
  branch:
    model: 'single-main'
    roles:
      - role: 'production'
        branch: 'main'
    protected:
      - 'main'
  merge-request:
    target: 'main'
  tracker:
    provider: 'github'
    project: 'pis-o-cake/engineering-system'
    default-assignee: 'pis-o-cake'
    agent:
      search: 'allowed'
      create: 'allowed'
      comment: 'allowed'
      close: 'ask'
      accept-risk: 'ask'
      commit-deadline: 'ask'

documentation:
  policy: 'packages/docs-gov/policy.yaml'
  architecture: 'docs/architecture/README.md'
  generated:
    - output: 'docs/generated/system-catalog.md'
      command: 'python3 tools/generate-catalog.py --check'
  authoring:
    assign:
      - path: 'README.md'
        type: 'guide'
      - path: 'docs/adr'
        type: 'decision-record'
      - path: 'docs/architecture'
        type: 'architecture'
      - path: 'docs/verification'
        type: 'verification-spec'
      - path: 'docs/reports'
        type: 'experiment-report'
      - path: 'docs/design'
        type: 'design-proposal'
    exempt:
      - '.claude'
      - '.github'
      - 'packages'
      - 'templates'
    deferred:
      - 'docs/design/0001-foundation.md'
      - 'docs/design/0002-document-authoring-contracts.md'
  review:
    scopes:
      - 'docs'
      - 'README.md'
  lifecycle:
    design:
      path: 'docs/design'
      frozen-status: ['implemented']
    adr:
      path: 'docs/adr'
      frozen-status: ['accepted']
