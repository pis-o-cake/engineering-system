policy:
  name: vcs-gov-commit
  version: 0.1.0-draft

# 시스템이 갖는 것은 포맷과 판정 규칙이다. 프로젝트는 값만 고른다 —
# subject 언어와 종결 어미, scope 목록, branch model, MR 대상 branch.
# 기계가 판정할 수 있는 것만 막는다. 「1 커밋 1 목적」과 WHAT·WHY 는 사람이 본다.

commit:
  header: '<type>(<scope>): <subject>'
  subject-max-characters: 50
  body-wrap-columns: 72
  blank-line-after-header: true
  types:
    - feat
    - fix
    - perf
    - refactor
    - docs
    - style
    - test
    - build
    - ci
    - chore
    - revert
  forbidden-trailers:
    - 'Co-Authored-By'
  # git 이 문안을 정하거나 rebase 가 흡수하는 메시지는 대상이 아니다.
  skip-headers:
    - 'Merge '
    - 'Revert '
    - 'fixup!'
    - 'squash!'
    - 'amend!'

# 종결 어미는 언어를 따라간다. 정규식으로 '명사인가'를 판정할 수 없으므로 목록에 적은
# 어미만 막는다. 잘못 막으면 규약이 아니라 훅을 피하게 된다.
subject-ending-noun:
  guidance: 'subject 는 명사형으로 끝낸다 — 추가·수정·변경·제거'
  forbidden:
    - '한다'
    - '된다'
    - '했다'
    - '짓다'
    - '던 것'
    - '단 것'
    - '는 것'
    - '은 것'

# imperative 에는 forbidden 목록을 두지 않는다. 접미사로 English 의 mood 를 판정하면
# 'shared' 가 'ed' 로 끝나 정상 subject 가 막힌다. 판정은 skill 과 사람이 한다.
subject-ending-imperative:
  guidance: 'use the imperative mood in the subject — Add, Fix, Change, Remove'

# 막지 않고 알리기만 한다. 판정이 아니라 신호다.
warn-subject-contains:
  - value: '·'
    message: 'subject 에 나열이 있다 — 한 줄에 변화 하나. 커밋을 쪼갤 신호다'
  - value: ' and '
    message: 'subject joins two changes — one change per commit'

# MR 과 PR 에 같은 규약을 적용한다. 제목은 commit 헤더 형식을 그대로 쓴다.
# heading 은 매번 지어내지 않는다. 절 제목이 MR 마다 달라지면 읽는 사람이 구조를 다시 파악한다.
merge-request:
  title: 'commit 헤더와 같은 형식. 핵심 변경과 대상을 한 줄로 쓴다'
  sections:
    - key: summary
      heading: '요약'
      question: '해결하는 문제와 변경 후 동작을 1~3문장으로 쓴다'
    - key: changes
      heading: '변경 사항'
      question: '주요 동작 변경과 적용 범위를 bullet 로 쓴다'
    - key: verification
      heading: '검증'
      question: '실제 실행한 명령과 결과, 중요한 미검증 항목을 쓴다'
    - key: impact
      heading: '영향 및 후속 작업'
      question: '호환성, 운영 영향, 채택에 필요한 조치, 남은 작업. 없으면 없음으로 적는다'
  writing:
    - '평서체 ~한다 · ~이다 로 통일한다'
    - '한 문장에 핵심 주장 하나만 쓴다. 결론을 먼저 쓰고 이유를 바로 뒤에 붙인다'
    - '같은 사실을 요약과 목록과 표에서 반복하지 않는다'
    - '사소한 변경은 절마다 한 문장이면 충분하다. 분량을 채우지 않는다'
    - '짧게 쓰더라도 동작을 바꾸는 예외와 호환성 문제와 중요한 trade-off 는 남긴다'
    - '설계 이유는 한 문장으로 적고 ADR 을 연결한다. ADR 내용을 본문에 다시 쓰지 않는다'
    - '검증은 명령과 결과로 적는다. 긴 로그는 실패 분석에 필요할 때만 넣는다'
  excluded:
    - '선언한 것 밖의 절 제목'
    - 'commit 목록 복사 — git log 가 이미 보여준다'
    - '작업 일지, 대화체, 수사적 강조, 비유, 자기평가'
    - '실행하지 않은 검사를 통과로 적기'
    - '알려진 예외가 있는데 언제나·모든 같은 단정적 표현 쓰기'
    - '자동 생성 서명과 홍보 문구'
    - '리뷰어가 물을 것이 뻔한 trade-off 를 빼기'

branch-models:
  - name: env-branch
    description: 'branch = environment. 배포 환경마다 영구 branch 를 두고 승격은 위로만 한다'
    feature: 'base 위로 rebase 한 뒤 fast-forward merge'
    promotion: '아래 환경에서 위 환경으로 fast-forward. 역방향 금지, hotfix back-merge 만 예외'
  - name: single-main
    description: 'main 하나. 모든 작업은 short-lived branch 로 한다'
    feature: 'main 위로 rebase 한 뒤 fast-forward merge'
    promotion: '없음. main 이 곧 배포 대상이다'
