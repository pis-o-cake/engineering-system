policy:
  name: 'docs-gov-document-types'
  version: '0.1.0-draft'
  criteria: 'packages/docs-gov/editorial.md'
  design: 'docs/design/0002-document-authoring-contracts.md'

# 유형마다 독자·질문, 필수 frontmatter, 필수 절을 선언한다.
# 절은 heading 문구를 고정하지 않고 답해야 할 질문을 정규식으로 확인한다.
# 문장의 적절성과 근거의 충분성은 문서를 읽는 편집 검토가 판정한다.
types:
  decision-record:
    filename: numbered
    readers: '기술 책임자와 유지보수자'
    question: '무엇을 왜 선택했고 어떤 비용을 감수했는가'
    required-frontmatter: ['type', 'status', 'date']
    statuses: ['proposed', 'accepted', 'deprecated', 'superseded', 'rejected']
    frozen-status: ['accepted', 'deprecated', 'superseded', 'rejected']
    sections:
      - key: 'decision'
        heading: '결정'
        pattern: '결정|채택|Decision'
      - key: 'context'
        heading: '배경과 제약'
        pattern: '문제|배경|제약|맥락|Context'
      - key: 'rationale'
        heading: '근거와 대안'
        pattern: '근거|이유|대안|Rationale|Alternatives'
      - key: 'consequence'
        heading: '영향'
        pattern: '결과|영향|비용|Consequences'

  architecture:
    filename: slug
    readers: '개발자와 운영자'
    question: '지금 어떤 구성요소가 어떤 책임과 경계로 동작하는가'
    required-frontmatter: ['type', 'status', 'last-reviewed']
    statuses: ['active', 'archived']
    sections:
      - key: 'overview'
        heading: '구조 요약'
        pattern: '개요|요약|overview|구조'
      - key: 'components'
        heading: '구성요소와 책임'
        pattern: '구성|component|책임|모듈'
      - key: 'flows'
        heading: '주요 흐름'
        pattern: '흐름|flow|시나리오|경로'
      - key: 'constraints'
        heading: '제약과 근거'
        pattern: '정본|source of truth|제약|policy|갱신'

  design-proposal:
    filename: numbered
    readers: '검토자와 구현 담당자'
    question: '이 범위와 방법으로 구현해도 되는가'
    required-frontmatter: ['type', 'status']
    statuses: ['draft', 'review', 'approved', 'implementing', 'implemented', 'superseded', 'obsolete']
    frozen-status: ['approved', 'implementing', 'implemented', 'superseded', 'obsolete']
    sections:
      - key: 'summary'
        heading: '제안 요약'
        pattern: '요약|개요|제안|목표|범위'
      - key: 'design'
        heading: '설계'
        pattern: '설계|구성|동작|흐름|모델|구현'

  project-scope:
    filename: slug
    readers: '프로젝트 책임자와 참여자'
    question: '무엇을 제공하며 어디까지 하면 완료인가'
    required-frontmatter: ['type', 'status']
    statuses: ['draft', 'approved', 'implemented', 'superseded']
    frozen-status: ['approved', 'implemented', 'superseded']
    sections:
      - key: 'scope'
        heading: '전체 범위'
        pattern: '범위'
      - key: 'done'
        heading: '기능별 완료 기준'
        pattern: '완료 기준|DoD|인수 기준'

  work-plan:
    filename: slug
    readers: '프로젝트 책임자와 실행 담당자'
    question: '누가 무엇을 언제까지 해야 하며 무엇이 막고 있는가'
    required-frontmatter: ['type', 'status', 'baseline-date']
    statuses: ['active', 'archived']
    sections:
      - key: 'baseline'
        heading: '기준 시점과 일정'
        pattern: '기준|일정|현황|기준 시점'
      - key: 'tasks'
        heading: '작업표'
        pattern: '작업|task|WBS|칸반|담당'
      - key: 'blockers'
        heading: '장애 요인과 조치'
        pattern: '장애|blocker|막힌|대기|필요한 조치|위험'

  brief:
    filename: dated
    readers: '상급자와 의사결정자'
    question: '현재 결과와 영향은 무엇이며 어떤 판단·지원이 필요한가'
    required-frontmatter: ['type', 'status', 'reported']
    statuses: ['draft', 'submitted', 'archived']
    frozen-status: ['submitted', 'archived']
    sections:
      - key: 'summary'
        heading: '보고 요약'
        pattern: '요약|보고 요약|결론|현황'
      - key: 'impact'
        heading: '주요 결과와 영향'
        pattern: '결과|영향|범위|일정|비용|품질'

  meeting-record:
    filename: dated
    readers: '참석자와 후속 담당자'
    question: '무엇을 결정했고 누가 무엇을 해야 하는가'
    required-frontmatter: ['type', 'status', 'observed']
    statuses: ['draft', 'confirmed', 'archived']
    frozen-status: ['confirmed', 'archived']
    sections:
      - key: 'meeting'
        heading: '회의 정보'
        pattern: '회의 개요|기본정보|일시|참석'
      - key: 'decision'
        heading: '결정 사항'
        pattern: '결정'
      - key: 'action'
        heading: '조치 사항'
        pattern: '조치|action|후속'

  verification-spec:
    filename: slug
    readers: '검증 담당자와 검수자'
    question: '어떤 조건과 방법으로 통과 여부를 판단하는가'
    required-frontmatter: ['type', 'status', 'version']
    statuses: ['draft', 'active', 'archived']
    sections:
      - key: 'scope'
        heading: '검증 범위'
        pattern: '범위|정하는 것|대상'
      - key: 'conditions'
        heading: '시험 조건'
        pattern: '규약|조건|환경|공통'
      - key: 'criteria'
        heading: '항목별 판정 기준'
        pattern: '기준|지표|판정|항목'
      - key: 'evidence'
        heading: '실행과 증빙'
        pattern: '산출물|증빙|증거|기록'

  verification-result:
    filename: dated
    readers: '검토자와 기능 인수자'
    question: '이 구현이 지정한 기준을 충족했는가'
    required-frontmatter: ['type', 'status', 'observed', 'spec', 'spec-version', 'target']
    statuses: ['draft', 'confirmed', 'archived']
    frozen-status: ['confirmed', 'archived']
    sections:
      - key: 'verdict'
        heading: '판정 요약'
        pattern: '판정|결론|요약'
      - key: 'conditions'
        heading: '대상과 실행 조건'
        pattern: '조건|대상|환경|실행'
      - key: 'results'
        heading: '기준별 결과'
        pattern: '기준별|항목별|결과'
      - key: 'evidence'
        heading: '증거와 재현'
        pattern: '증거|원자료|재현'

  experiment-report:
    filename: dated
    readers: '기술 선택을 하는 개발자'
    question: '무엇을 확인했고 어디까지 적용할 수 있는가'
    required-frontmatter: ['type', 'status', 'observed']
    statuses: ['draft', 'active', 'archived', 'obsolete', 'superseded']
    frozen-status: ['archived', 'obsolete', 'superseded']
    sections:
      - key: 'conclusion'
        heading: '결론과 적용 범위'
        pattern: '결론|판정|확인한 것'
      - key: 'method'
        heading: '실험 조건'
        pattern: '방법|조건|측정|설계|절차|환경'
      - key: 'results'
        heading: '결과'
        pattern: '결과|실측|값|비교|측정값'
      - key: 'limits'
        heading: '한계와 후속 조치'
        pattern: '한계|적용 범위|말할 수 없는|후속|제약'

  review-report:
    filename: dated
    readers: '수정 담당자와 책임자'
    question: '어떤 결함이 어떤 영향을 주며 무엇부터 해결해야 하는가'
    required-frontmatter: ['type', 'status', 'observed']
    statuses: ['draft', 'active', 'archived']
    frozen-status: ['archived']
    sections:
      - key: 'summary'
        heading: '검토 요약'
        pattern: '요약|말하는 것|검토 범위|결론'
      - key: 'findings'
        heading: '발견 사항'
        pattern: '발견|지적|결함|Critical|P0|항목'
      - key: 'followup'
        heading: '조치와 잔여 위험'
        pattern: '조치|우선순위|잔여|남은|후속'

  runbook:
    filename: slug
    readers: '운영 담당자'
    question: '어떤 상황에서 어떻게 실행하고 성공·실패를 판단하는가'
    required-frontmatter: ['type', 'status', 'last-reviewed']
    statuses: ['active', 'archived']
    sections:
      - key: 'applies'
        heading: '적용 상황'
        pattern: '적용|대상|넘기는 것|역할|범위|전제'
      - key: 'precheck'
        heading: '실행 전 확인'
        pattern: '실행 전|사전 확인|전제 조건|준비|사전 점검'
      - key: 'procedure'
        heading: '절차'
        pattern: '절차|기동|실행|운영|단계|설치'
      - key: 'confirm'
        heading: '성공 확인'
        pattern: '성공|확인 후|검증|점검 결과'
      - key: 'recovery'
        heading: '실패와 복구'
        pattern: '실패|장애|복구|되돌리|대응'

  ui-guideline:
    filename: slug
    readers: '프론트엔드 개발자와 디자이너'
    question: '현재 UI를 어떤 규칙으로 구현·변경하는가'
    required-frontmatter: ['type', 'status', 'last-reviewed']
    statuses: ['active', 'archived']
    sections:
      - key: 'scope'
        heading: '적용 범위'
        pattern: '범위|무엇을|대상|적용'
      - key: 'rules'
        heading: '컴포넌트와 표현 규칙'
        pattern: '규칙|토큰|컴포넌트|레이아웃|요구'
      - key: 'checks'
        heading: '검사 기준'
        pattern: '검증|검사|기준|확인'

  prototype-record:
    filename: slug
    readers: '디자이너와 구현 담당자'
    question: '어떤 화면을 확인했고 실제 구현에 무엇이 필요한가'
    required-frontmatter: ['type', 'status', 'prototype-version']
    statuses: ['active', 'archived', 'superseded']
    frozen-status: ['archived', 'superseded']
    sections:
      - key: 'target'
        heading: '대상과 version'
        pattern: '대상|범위|version|판본'
      - key: 'screens'
        heading: '화면과 상태'
        pattern: '화면|상태|screen|플로우'
      - key: 'handoff'
        heading: '구현 인계 사항'
        pattern: '인계|구현|연동|handoff|차이'

  # guide 와 ledger 는 대상·필드가 위치마다 달라 절을 강제하지 않는다. metadata 와 근거 링크만 검사한다.
  guide:
    filename: slug
    readers: '이 위치에서 작업을 시작하는 사람'
    question: '여기서 무엇을 어떻게 시작하는가'
    required-frontmatter: ['type', 'status']
    statuses: ['active', 'archived']

  ledger:
    filename: slug
    readers: '비용·수량을 누적 집계하는 담당자'
    question: '언제 무엇에 얼마가 들었는가'
    required-frontmatter: ['type', 'status']
    statuses: ['active', 'archived']

# 기존 프로젝트의 type 값을 일괄 변경하지 않기 위한 대응표.
aliases:
  adr: 'decision-record'
  system-design: 'design-proposal'
  current-architecture: 'architecture'
  design-doc: 'design-proposal'
  design-evidence: 'design-proposal'
  design-set: 'guide'
  project-guide: 'guide'
  decision-record-index: 'guide'
  operations-runbook: 'runbook'
  operations-guide: 'guide'
  current-ui-policy: 'ui-guideline'
  prototype-catalog: 'guide'
  prototype-handoff: 'prototype-record'
  prototype-verification: 'prototype-record'
  prototype-guide: 'guide'
  experiment-record: 'experiment-report'
  measurement-record: 'experiment-report'
  environment-observation: 'experiment-report'
  experiment-guide: 'guide'
  experiment-data-guide: 'guide'
  experiment-followup: 'review-report'
  experiment-ledger: 'ledger'
  review-record: 'review-report'
  project-progress-snapshot: 'brief'
  documentation-policy: 'guide'
