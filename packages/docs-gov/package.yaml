package:
  name: docs-gov
  version: 0.1.0-draft
  status: draft
  owns:
    - documentation lifecycle classification
    - documentation impact prompt
    - generated-document verification contract
    - historical-record guardrails
    - individual document editorial review and review freshness gate
    - document type contracts and their structural check
    - per-document structure feedback while a session edits
  claude-code:
    skills:
      - claude-code/skills/documentation-impact
      - claude-code/skills/write-document
      - claude-code/skills/review-document
    hooks:
      - event: PreToolUse
        matcher: Edit|MultiEdit|Write
        command: claude-code/hooks/block-generated-edit.sh
        timeout: 3
      - event: PostToolUse
        matcher: Edit|MultiEdit|Write
        command: claude-code/hooks/check-document-structure.sh
        timeout: 10
      - event: SessionStart
        command: claude-code/hooks/session-status.sh
        timeout: 5
