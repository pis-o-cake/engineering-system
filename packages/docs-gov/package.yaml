package:
  name: docs-gov
  version: 0.1.0-draft
  status: draft
  owns:
    - documentation lifecycle classification
    - documentation impact prompt
    - generated-document verification contract
    - historical-record guardrails
  claude-code:
    skills:
      - claude-code/skills/documentation-impact
    hooks:
      - event: PreToolUse
        matcher: Edit|MultiEdit|Write
        command: claude-code/hooks/block-generated-edit.sh
        timeout: 3
