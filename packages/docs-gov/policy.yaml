policy:
  name: docs-gov
  version: 0.1.0-draft

classes:
  generated-output:
    detect: documentation.generated[].output
    agent-action: deny-direct-edit
    native-action: run-declared-generator-check
  historical-record:
    detect: documentation.lifecycle.*.path with frozen-status
    agent-action: warn-and-route-to-lifecycle-skill
    native-action: validate-frontmatter-and-links
  current-document:
    detect: project-declared current architecture or runbook path
    agent-action: show-impact-prompt
    native-action: project-declared-docs-check

historical-records:
  required-frontmatter: [type, status]
  statuses:
    design: [draft, review, approved, implementing, implemented, superseded, obsolete]
    adr: [proposed, accepted, deprecated, superseded, rejected]

triggers:
  data-model:
    prompt:
      - generated-output review
      - current architecture review
      - ADR review
  runtime-boundary:
    prompt:
      - current architecture review
      - ADR review
  api-contract:
    prompt:
      - runtime API reference review
  deployment-boundary:
    prompt:
      - current architecture review
      - runbook review

constraints:
  no-inferred-rationale: true
  no-automatic-historical-rewrite: true
  generated-output-owner: generator

editorial-review:
  criteria: packages/docs-gov/editorial.md
  review-unit: one-complete-document
  reviewer-action: read-edit-and-reread
  receipt: .engsys/reviews/<document-path>.review
  native-action: check-receipt-and-content-hash
  project-enforcement: explicit-native-command-with-review-scopes
  constraints:
    - no-automated-prose-grading
    - no-batch-review-approval
    - no-invented-evidence-or-reviewer
    - no-pass-with-unresolved-contradictions

document-types:
  registry: packages/docs-gov/document-types.yaml
  design: docs/design/0002-document-authoring-contracts.md
  project-declaration: documentation.authoring
  native-action: check-declared-type-metadata-and-sections
  frozen-records: presence-required-order-preserved
  deferred-records: project-listed-paths-keep-metadata-checks-only
  constraints:
    - no-prose-scoring
    - no-uniform-template-across-types
    - no-policy-copy-per-project
